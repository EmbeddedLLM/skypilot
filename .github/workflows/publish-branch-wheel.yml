name: Publish Branch Wheel

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Source branch to build
        required: true
        default: ellm-0.12.0
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/${{ inputs.branch }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Set wheel version
        env:
          SOURCE_BRANCH: ${{ inputs.branch }}
        run: |
          python - <<'PY'
          import datetime
          import os
          from pathlib import Path
          import re

          init = Path('sky/__init__.py')
          content = init.read_text()
          base = re.fullmatch(r'ellm-(\d+\.\d+\.\d+)', os.environ['SOURCE_BRANCH'])
          base = base[1] if base else re.search(r"^__version__ = ['\"](\d+\.\d+\.\d+)", content, re.M)[1]
          version = f'{base}+ellm.{datetime.datetime.now(datetime.timezone.utc):%Y%m%d}'
          init.write_text(re.sub(r'^__version__ = .*$', f"__version__ = '{version}'", content, flags=re.M))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'WHEEL_VERSION={version}\n')
          PY

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Publish wheel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "wheel-$WHEEL_VERSION" dist/*.whl \
            --target "$(git rev-parse HEAD)" --title "SkyPilot $WHEEL_VERSION" \
            --notes '' --prerelease --latest=false
